name: Build, Scan, and Publish

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  lint:
    name: Lint Dockerfile
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          failure-threshold: warning

  build-scan-publish:
    name: Build, Scan, and Publish Image
    runs-on: ubuntu-latest
    needs: lint
    permissions:
      contents: read
      packages: write
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Get image ref for scanner
        id: image-ref
        env:
          META_JSON: ${{ steps.meta.outputs.json }}
        run: |
          REF=$(python3 - <<'PY'
          import json
          import os
          data = json.loads(os.environ["META_JSON"])
          tags = data.get("tags") or []
          print(tags[0] if tags else "")
          PY
          )
          if [ -z "$REF" ] || [ "$REF" = "null" ]; then
            echo "Unable to determine image ref from docker metadata output."
            exit 1
          fi
          echo "ref=$REF" >> $GITHUB_OUTPUT
          echo "Image to scan: $REF"
          echo "Event: ${{ github.event_name }}"
          echo "Git ref: ${{ github.ref }}"

      # Save to tar so Grype can scan the locally built image from disk.
      - name: Save image for Grype
        run: |
          docker save ${{ steps.image-ref.outputs.ref }} -o image.tar
          ls -la image.tar

      - name: Run Grype vulnerability scanner (table)
        run: |
          docker run --rm \
            -v "$PWD:/workdir" \
            -w /workdir \
            anchore/grype:v0.111.1 docker-archive:image.tar \
            --output table \
            --fail-on high

      - name: Push Docker image to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
