<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello from Nginx</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Syne', sans-serif;
            background: 
                radial-gradient(ellipse at 20% 80%, rgba(120, 0, 255, 0.15) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 20%, rgba(255, 107, 0, 0.12) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 50%, rgba(0, 200, 150, 0.08) 0%, transparent 70%),
                linear-gradient(160deg, #0a0a0f 0%, #1a1a2e 50%, #0f0f1a 100%);
            overflow: hidden;
        }
        
        .container {
            text-align: center;
            padding: 3rem;
            position: relative;
            z-index: 1;
        }
        
        .greeting {
            font-size: clamp(3rem, 12vw, 8rem);
            font-weight: 800;
            background: linear-gradient(135deg, #ff6b00 0%, #ff2d7a 50%, #7000ff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.03em;
            line-height: 1.1;
            animation: breathe 4s ease-in-out infinite;
        }
        
        .subtitle {
            font-size: clamp(1rem, 3vw, 1.5rem);
            color: rgba(255, 255, 255, 0.6);
            margin-top: 1.5rem;
            font-weight: 400;
            letter-spacing: 0.2em;
            text-transform: uppercase;
        }
        
        .badge {
            display: inline-block;
            margin-top: 3rem;
            padding: 0.75rem 2rem;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 100px;
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.85rem;
            letter-spacing: 0.1em;
            backdrop-filter: blur(10px);
        }
        
        .badge span {
            color: #00d4aa;
        }
        
        @keyframes breathe {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.9; transform: scale(1.02); }
        }
        
        /* Floating geometric shapes */
        .shape {
            position: fixed;
            border-radius: 50%;
            filter: blur(60px);
            opacity: 0.4;
            animation: float 20s ease-in-out infinite;
        }
        
        .shape-1 {
            width: 400px;
            height: 400px;
            background: #7000ff;
            top: -100px;
            right: -100px;
            animation-delay: 0s;
        }
        
        .shape-2 {
            width: 300px;
            height: 300px;
            background: #ff6b00;
            bottom: -50px;
            left: -50px;
            animation-delay: -7s;
        }
        
        .shape-3 {
            width: 200px;
            height: 200px;
            background: #00d4aa;
            top: 50%;
            left: 50%;
            animation-delay: -14s;
        }
        
        @keyframes float {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            25% { transform: translate(30px, -30px) rotate(90deg); }
            50% { transform: translate(-20px, 20px) rotate(180deg); }
            75% { transform: translate(-30px, -10px) rotate(270deg); }
        }
    </style>
</head>
<body>
    <div class="shape shape-1"></div>
    <div class="shape shape-2"></div>
    <div class="shape shape-3"></div>
    
    <div class="container">
        <h1 class="greeting">Hello, World!</h1>
        <p class="subtitle">Served fresh by Nginx</p>
        <div class="badge">Running on <span>nginx:1.27.3-alpine</span></div>
    </div>
</body>
</html>
